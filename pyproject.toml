[project]
name = "raise-my-agent"
version = "1.0.0"
description = "『내 자식 에이전트 키우기』 실습 코드 (LangChain & LangGraph v1)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "장민기" },
    { name = "이한상" },
    { name = "양지수" },
]
dependencies = [
    # 1~7장: LangChain / LangGraph 기본
    "langchain>=1.2,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.1",
    "langchain-anthropic>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",
    # 4장, 10장: 스튜디오 실습 (LangGraph Studio + 네이버 검색)
    "langgraph-cli[inmem]>=0.4",
    "langchain-community>=0.4",
    "langchain-naver-community>=0.2",
    # 8장: 지식베이스 (Neo4j)
    "langchain-neo4j>=0.9",
    "neo4j>=5.0",
    # 9장: MCP
    #   fastmcp 3.x는 리스트를 반환하는 Resource(9-3 get_subject_curriculum)에서 오류가 나고,
    #   fastmcp 4.x는 mcp 2.x를 요구하는데 langchain-mcp-adapters가 아직 mcp 2.x를 지원하지 않습니다.
    #   fastmcp 2.x에 알려진 보안 권고(CVE-2025-64340: Windows의 `fastmcp install` 명령,
    #   CVE-2026-27124: GitHub OAuth 프록시)는 이 리포가 쓰지 않는 기능에만 해당합니다.
    "fastmcp>=2.12,<3",
    #   0.3.2부터 mcp<2 상한이 명시되어 함께 동작하는 mcp 1.x가 설치됩니다.
    "langchain-mcp-adapters>=0.3.2",
]

[dependency-groups]
# `uv sync`는 dev 그룹도 함께 설치합니다.
dev = [
    # 리포지토리 점검 (tests/, CI)
    "ruff>=0.6",
    "pytest>=8.0",
    # VS Code, PyCharm에서 `# %%` 셀 단위로 실행할 때 필요한 주피터 커널
    "ipykernel>=6.29",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".langgraph_api"]

[tool.ruff.lint]
# 문법 오류와 정의되지 않은 이름만 검사합니다 (책의 코드 스타일은 그대로 둡니다).
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
